# Orbisk theme: dark space look. The page background is a starfield drawn by the CSS in app.py; cyan is the primary
# colour (from the logo's orbit ring) so buttons never share a colour with the red / yellow / green risk levels.
[theme]
base = "dark"
primaryColor = "#2BB5C8"
backgroundColor = "#070b1a"
secondaryBackgroundColor = "#0f1730"
textColor = "#e8eefc"
dataframeHeaderBackgroundColor = "#152247"
dataframeBorderColor = "#24365f"
